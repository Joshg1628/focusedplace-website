<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="72" height="72">
  <!-- Focused mark: the app icon, a shul doorway (framed nested arches) with vibration
       waves, on near-black with a violet glow, cropped to a rounded square. Matches
       Resources/AppIcon in the app. -->
  <defs>
    <clipPath id="corner">
      <rect x="18" y="18" width="72" height="72" rx="16" ry="16"/>
    </clipPath>
    <linearGradient id="dark" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="90">
      <stop offset="0" stop-color="#1F1530"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="54" cy="50.4" r="43.2">
      <stop offset="0" stop-color="#8126F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8126F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A45CFF"/>
      <stop offset="1" stop-color="#E23CC4"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#corner)">
    <rect x="0" y="0" width="108" height="108" fill="url(#dark)"/>
    <rect x="0" y="0" width="108" height="108" fill="url(#glow)"/>
    <rect x="37" y="37" width="34" height="34" rx="6" fill="none" stroke="url(#stroke)" stroke-width="3"/>
    <path d="M42.1 69.5V54a11.9 11.9 0 0 1 23.8 0v15.5" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M47.2 69.5V56.6a6.8 6.8 0 0 1 13.6 0V69.5" fill="none" stroke="#F5F5F5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32.3 48.9Q29.8 54 32.3 59.1M75.7 48.9Q78.2 54 75.7 59.1" fill="none" stroke="#BB86FC" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M28.1 45.9Q24.7 54 28.1 62.1M79.9 45.9Q83.3 54 79.9 62.1" fill="none" stroke="#BB86FC" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.55"/>
